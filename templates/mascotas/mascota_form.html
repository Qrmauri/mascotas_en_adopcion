{% extends "base.html" %}
{% block content %}
<h1>{% if object %}Editar {{ object.nombre }}{% else %}Publicar mascota{% endif %}</h1>
<form method="post" class="card">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Guardar</button>
  <a class="btn sec" href="{% url 'mascota-list' %}">Cancelar</a>
</form>
{% endblock %}
